# port 80 to redirect everything to HTTPS
# AddWord: Step 10: In production, receives request from createEntry function in utilities. location /api/ matches then proxies to http://backend:8000/api/. Docker Compose's internal DNS resolves it. In dev vite.config.js  resolves to localhost:8000
server {
    listen 80;
    listen [::]:80;
    server_name _;

    index index.html;


    location /api/ {
        proxy_pass http://backend:8000/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;

    }

    location /static/ {
        alias /vol/static/;
    }

    location /media/ {
        alias /vol/media/;
    }


}